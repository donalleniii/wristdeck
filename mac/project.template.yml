name: WristDeckNotch
options:
  bundleIdPrefix: com.donalleniii
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: __DEVELOPMENT_TEAM__
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WristDeckNotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
    scheme: {}
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: WristDeck Notch
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # Menu-bar/overlay only: no Dock icon, no main window.
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.donalleniii.wristdecknotch
